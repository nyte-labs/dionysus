<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Dionysus Login</title>
        <link rel="stylesheet" th:href="@{/css/base.css}">
        <link rel="stylesheet" th:href="@{/css/login.css}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="login-page-wrapper">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo-container">
                        <img th:src="@{/img/dionysus-small.png}"/>
                        <span class="nav-brand">Dionysus</span>
                    </div>
                </div>

                <div class="error-banner" th:classappend="${param.error != null or param.expired != null} ? 'is-visible'">
                    <p th:if="${param.error != null}">Invalid username or password.</p>
                    <p th:if="${param.expired != null}">Your session expired. Please sign in again.</p>
                </div>

                <form class="login-form" method="post" th:action="@{/login}">
                    <div class="input-group">
                        <label class="input-label">Username or email</label>
                        <input type="text" id="username-input" class="text-input" placeholder="you@example.com" name="username"/>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Password</label>
                        <input type="password" id="password-input" class="text-input" placeholder="••••••••" name="password"/>
                    </div>

                    <div class="form-options">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember" name="remember-me" class="checkbox-input"/>
                            <label for="remember" class="checkbox-label">Keep me signed in</label>
                        </div>
                        <a href="#" class="link-accent">Forgot?</a>
                    </div>
                    <button type="submit" class="btn-primary">Continue</button>

                    <div class="footer-text">
                        <span>Don't have an account?</span>
                        <a href="#" class="link-accent" style="margin-left: 4px;">Create one</a>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
